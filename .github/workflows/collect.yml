name: FlowerCRM Collect

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows to collect"
        required: false
        default: "300"
      max_queue_visits:
        description: "Maximum queue visits"
        required: false
        default: "40"
      max_runtime_ms:
        description: "Maximum runtime in milliseconds"
        required: false
        default: "1200000"
      dry_run:
        description: "Run without writing Google Sheets/SYSTEM/LOG"
        required: false
        default: "false"
      debug:
        description: "Print detailed provider/search/filter logs"
        required: false
        default: "false"
  schedule:
    # KST 00, 03, 06, 09, 12, 15, 18, 21
    - cron: "0 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: read

concurrency:
  group: flowercrm-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      USE_KAKAO_API_PROVIDER: ${{ vars.USE_KAKAO_API_PROVIDER || 'false' }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      GOOGLE_DRIVE_FOLDER_ID: 1J-WmPxvc7FgD1nl6yeVnHJgalZGXoNRN
      COLLECT_LIMIT: ${{ github.event.inputs.limit || '300' }}
      COLLECT_MAX_QUEUE_VISITS: ${{ github.event.inputs.max_queue_visits || '40' }}
      COLLECT_MAX_RUNTIME_MS: ${{ github.event.inputs.max_runtime_ms || '1200000' }}
      COLLECT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      COLLECT_DEBUG: ${{ github.event.inputs.debug || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show run configuration
        shell: bash
        run: |
          echo "FlowerCRM Collect started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Limit: ${COLLECT_LIMIT}"
          echo "Max queue visits: ${COLLECT_MAX_QUEUE_VISITS}"
          echo "Max runtime ms: ${COLLECT_MAX_RUNTIME_MS}"
          echo "Dry run: ${COLLECT_DRY_RUN}"
          echo "Debug: ${COLLECT_DEBUG}"
          echo "Spreadsheet ID: ${GOOGLE_SPREADSHEET_ID}"
          echo "Queue state source: Google Sheets SYSTEM tab"
          echo "Google service account secret configured: $([[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]] && echo yes || echo no)"
          echo "Default providers: Playwright Kakao Map -> Playwright Google"
          echo "Optional Kakao API provider enabled: ${USE_KAKAO_API_PROVIDER}"
          echo "Kakao API secret configured: $([[ -n "${KAKAO_REST_API_KEY}" ]] && echo yes || echo no)"

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing required GitHub Secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          node -e "console.log('process.env.GOOGLE_SERVICE_ACCOUNT_JSON configured:', Boolean(process.env.GOOGLE_SERVICE_ACCOUNT_JSON)); console.log('process.env.KAKAO_REST_API_KEY configured optional:', Boolean(process.env.KAKAO_REST_API_KEY));"

      - name: Run collector
        shell: bash
        run: |
          args=(--limit "${COLLECT_LIMIT}" --max-queue-visits "${COLLECT_MAX_QUEUE_VISITS}" --max-runtime-ms "${COLLECT_MAX_RUNTIME_MS}")
          if [[ "${COLLECT_DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${COLLECT_DEBUG}" == "true" ]]; then
            args+=(--debug)
          fi
          echo "npm run collect -- ${args[*]}"
          npm run collect -- "${args[@]}"

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowercrm-collect-logs
          path: logs/
          if-no-files-found: warn
