name: FlowerCRM Collect

on:
  workflow_dispatch:
  schedule:
    # 02:00 KST = 17:00 UTC
    - cron: "0 17 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      GOOGLE_DRIVE_FOLDER_ID: 1J-WmPxvc7FgD1nl6yeVnHJgalZGXoNRN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show run configuration
        shell: bash
        run: |
          echo "FlowerCRM Collect started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Limit: 300"
          echo "Spreadsheet ID: ${GOOGLE_SPREADSHEET_ID}"
          echo "Google service account secret configured: $([[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]] && echo yes || echo no)"
          echo "Kakao API secret configured: $([[ -n "${KAKAO_REST_API_KEY}" ]] && echo yes || echo no)"

      - name: Run collector
        run: npm run collect -- --limit 300

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowercrm-collect-logs
          path: logs/
          if-no-files-found: warn
