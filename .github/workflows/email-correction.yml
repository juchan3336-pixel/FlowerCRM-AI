name: FlowerCRM Email Correction
run-name: ${{ format('Email correction {0} ({1})', github.event.inputs.manifest, github.event.inputs.dry_run == 'false' && 'live' || 'dry-run') }}

# Clears audited operator emails from the 기업 DB tab (column H) and appends a note to the memo
# (column M). Manual only. Writes nothing unless dry_run is exactly "false"; even then it stops
# before writing if any listed row no longer shows the audited company name and email.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Correction manifest under corrections/"
        required: true
        default: "corrections/2026-11-17-operator-emails.json"
      dry_run:
        description: "true = read and plan only. Type exactly false to write."
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: flowercrm-email-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      CORRECTION_MANIFEST: ${{ github.event.inputs.manifest }}
      CORRECTION_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [[ "${CORRECTION_DRY_RUN}" != "true" && "${CORRECTION_DRY_RUN}" != "false" ]]; then
            echo "::error::dry_run must be exactly true or false"
            exit 1
          fi
          if [[ ! "${CORRECTION_MANIFEST}" =~ ^corrections/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "::error::manifest must be a .json file directly under corrections/"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run correction
        shell: bash
        run: |
          args=(--manifest "${CORRECTION_MANIFEST}")
          if [[ "${CORRECTION_DRY_RUN}" == "false" ]]; then
            args+=(--live)
          fi
          echo "Dry run: ${CORRECTION_DRY_RUN}"
          node src/emailCorrectionCli.js "${args[@]}"
