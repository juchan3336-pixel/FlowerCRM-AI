name: FlowerCRM Enrich

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows to enrich for this run"
        required: false
        default: "300"
      debug:
        description: "Print per-company enrich debug logs"
        required: false
        default: "false"
  schedule:
    # Collect workflow +25 minutes
    - cron: "25 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: read

concurrency:
  group: flowercrm-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      GOOGLE_DRIVE_FOLDER_ID: 1J-WmPxvc7FgD1nl6yeVnHJgalZGXoNRN
      ENRICH_LIMIT: ${{ github.event.inputs.limit || '300' }}
      ENRICH_DEBUG: ${{ github.event.inputs.debug || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show run configuration
        shell: bash
        run: |
          echo "FlowerCRM Enrich started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Limit: ${ENRICH_LIMIT:-300}"
          echo "Spreadsheet ID: ${GOOGLE_SPREADSHEET_ID}"
          echo "Google service account secret configured: $([[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]] && echo yes || echo no)"
          echo "Naver API secrets configured: $([[ -n "${NAVER_CLIENT_ID}" && -n "${NAVER_CLIENT_SECRET}" ]] && echo yes || echo no)"

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing required GitHub Secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          if [[ -z "${NAVER_CLIENT_ID}" || -z "${NAVER_CLIENT_SECRET}" ]]; then
            echo "Naver API secrets are not configured; Enrich will fall back to Google and Playwright search."
          fi

      - name: Run enrich
        id: run_enrich
        shell: bash
        run: |
          mkdir -p logs
          if [[ "${ENRICH_DEBUG}" == "true" ]]; then
            npm run enrich -- --limit "${ENRICH_LIMIT:-300}" --debug 2>&1 | tee logs/enrich-output.log
          else
            npm run enrich -- --limit "${ENRICH_LIMIT:-300}" 2>&1 | tee logs/enrich-output.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowercrm-enrich-logs
          path: logs/
          if-no-files-found: warn

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: enrich
          RUN_STEP_OUTCOME: ${{ steps.run_enrich.outcome }}
        run: |
          node src/discordNotify.js enrich --summary logs/discord-enrich-summary.json --error-log logs/enrich-output.log || true
