name: FlowerCRM Enrich

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows to enrich for this run"
        required: false
        default: "300"
  schedule:
    # Collect workflow +25 minutes
    - cron: "25 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: read

concurrency:
  group: flowercrm-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      GOOGLE_DRIVE_FOLDER_ID: 1J-WmPxvc7FgD1nl6yeVnHJgalZGXoNRN
      ENRICH_LIMIT: ${{ github.event.inputs.limit || '300' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show run configuration
        shell: bash
        run: |
          echo "FlowerCRM Enrich started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Limit: ${ENRICH_LIMIT:-300}"
          echo "Spreadsheet ID: ${GOOGLE_SPREADSHEET_ID}"
          echo "Google service account secret configured: $([[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]] && echo yes || echo no)"
          echo "Naver API secrets configured: $([[ -n "${NAVER_CLIENT_ID}" && -n "${NAVER_CLIENT_SECRET}" ]] && echo yes || echo no)"

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing required GitHub Secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          if [[ -z "${NAVER_CLIENT_ID}" || -z "${NAVER_CLIENT_SECRET}" ]]; then
            echo "Naver API secrets are not configured; Enrich will fall back to Google and Playwright search."
          fi

      - name: Run enrich
        run: npm run enrich -- --limit "${ENRICH_LIMIT:-300}"

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowercrm-enrich-logs
          path: logs/
          if-no-files-found: warn
