name: FlowerCRM Enrich
# The dispatch id, when there is one, ties a run to the scheduler's ledger row that asked for it.
run-name: ${{ github.event.inputs.dispatch_id && format('Enrich {0}', github.event.inputs.dispatch_id) || 'FlowerCRM Enrich' }}

on:
  # No schedule trigger. GitHub's scheduler skips most runs in this repository (2026-11-10: zero in
  # five and a half hours after a 90-minute cron was added), while a manual dispatch always starts
  # at once. So the timing lives outside: a Supabase cron job asks the app, every 90 minutes, to
  # send this dispatch (seo-platform/app/api/enrich/dispatch, operations/enrich_dispatch_cron.sql).
  # Keeping a cron here as well would mean two schedulers writing the same rows.
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Set by the external scheduler; leave empty for a manual run"
        required: false
        default: ""
      limit:
        description: "Rows to enrich for this run"
        required: false
        default: "50"
      debug:
        description: "Print per-company enrich debug logs"
        required: false
        default: "false"
      dry_run:
        description: "true (default) = search only, nothing is written. Type false to write 기업DB/SYSTEM/LOG"
        required: false
        default: "true"
      from_start:
        description: "Start this run from row 2 instead of SYSTEM.enrich_current_row"
        required: false
        default: "false"
      start_row:
        description: "Optional explicit row number to start from for this run"
        required: false
        default: ""
      max_runtime_ms:
        description: "Stop gracefully before GitHub job timeout so logs and summary are written"
        required: false
        default: "3000000"
      max_row_runtime_ms:
        description: "Per-row time budget in ms (0 disables)."
        required: false
        default: "45000"
      max_search_queries:
        description: "Max search queries per row (0 disables)."
        required: false
        default: "8"
      max_result_pages:
        description: "Max search-result page reads per row (0 disables)."
        required: false
        default: "12"
      max_homepage_pages:
        description: "Max company homepage/contact-page visits per row (0 disables)."
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: flowercrm-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0
      GOOGLE_DRIVE_FOLDER_ID: 1J-WmPxvc7FgD1nl6yeVnHJgalZGXoNRN
      ENRICH_LIMIT: ${{ github.event.inputs.limit || '50' }}
      ENRICH_DEBUG: ${{ github.event.inputs.debug || 'false' }}
      # Nothing writes without being asked by name: read-only unless dry_run is exactly "false".
      # The external scheduler sends that value itself, from its own control row.
      ENRICH_DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      ENRICH_FROM_START: ${{ github.event.inputs.from_start || 'false' }}
      ENRICH_START_ROW: ${{ github.event.inputs.start_row || '' }}
      ENRICH_MAX_RUNTIME_MS: ${{ github.event.inputs.max_runtime_ms || '3000000' }}
      ENRICH_ROW_MAX_RUNTIME_MS: ${{ github.event.inputs.max_row_runtime_ms || '45000' }}
      ENRICH_MAX_SEARCH_QUERIES_PER_ROW: ${{ github.event.inputs.max_search_queries || '8' }}
      ENRICH_MAX_RESULT_PAGES_PER_ROW: ${{ github.event.inputs.max_result_pages || '12' }}
      ENRICH_MAX_HOMEPAGE_PAGES_PER_ROW: ${{ github.event.inputs.max_homepage_pages || '6' }}

    steps:
      # Must stay the first step. timeout-minutes counts from here, so the instant by which the
      # enrich process has to be finished is fixed here too — 55 minutes in, leaving 5 for the log
      # upload and the notification. Setup time spent after this point comes out of that budget
      # instead of being handed out again when the process starts.
      - name: Fix job deadline
        shell: bash
        run: |
          echo "ENRICH_JOB_DEADLINE_AT_MS=$(( $(date +%s) * 1000 + 3300000 ))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show run configuration
        shell: bash
        run: |
          echo "FlowerCRM Enrich started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Limit: ${ENRICH_LIMIT:-300}"
          echo "Dry run: ${ENRICH_DRY_RUN:-true}"
          echo "From start: ${ENRICH_FROM_START:-false}"
          echo "Start row: ${ENRICH_START_ROW:-SYSTEM}"
          echo "Max runtime ms: ${ENRICH_MAX_RUNTIME_MS:-3000000}"
          echo "Row max runtime ms: ${ENRICH_ROW_MAX_RUNTIME_MS:-45000}"
          echo "Max search queries/row: ${ENRICH_MAX_SEARCH_QUERIES_PER_ROW:-8}"
          echo "Max result pages/row: ${ENRICH_MAX_RESULT_PAGES_PER_ROW:-12}"
          echo "Max homepage pages/row: ${ENRICH_MAX_HOMEPAGE_PAGES_PER_ROW:-6}"
          echo "Spreadsheet ID: ${GOOGLE_SPREADSHEET_ID}"
          echo "Google service account secret configured: $([[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]] && echo yes || echo no)"
          echo "Job deadline (epoch ms): ${ENRICH_JOB_DEADLINE_AT_MS}"
          echo "Default Enrich providers: Playwright browser search + job-site discovery; REST search APIs are not used by default"

      - name: Validate dry_run input
        shell: bash
        run: |
          # Writing to the sheet has to be asked for by name. Anything other than an exact
          # true/false stops here instead of being read as one or the other.
          if [[ "${ENRICH_DRY_RUN}" != "true" && "${ENRICH_DRY_RUN}" != "false" ]]; then
            echo "::error::dry_run must be exactly 'true' or 'false' (got '${ENRICH_DRY_RUN}')"
            exit 1
          fi

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing required GitHub Secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Notify Discord Started
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: enrich
        run: |
          mkdir -p logs
          cat > logs/discord-enrich-started-summary.json <<EOF
          {"status":"STARTED","limit":"${ENRICH_LIMIT:-300}","startRow":"${ENRICH_START_ROW:-SYSTEM}","dryRun":"${ENRICH_DRY_RUN:-true}"}
          EOF
          node src/discordNotify.js enrich --summary logs/discord-enrich-started-summary.json || true

      - name: Run enrich
        id: run_enrich
        shell: bash
        run: |
          mkdir -p logs
          args=(--limit "${ENRICH_LIMIT:-300}")
          if [[ "${ENRICH_DEBUG}" == "true" ]]; then
            args+=(--debug)
          fi
          # Live only on an explicit false; every other value keeps the run read-only.
          if [[ "${ENRICH_DRY_RUN}" != "false" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${ENRICH_FROM_START}" == "true" ]]; then
            args+=(--from-start)
          fi
          if [[ -n "${ENRICH_START_ROW}" ]]; then
            args+=(--start-row "${ENRICH_START_ROW}")
          fi
          if [[ -n "${ENRICH_MAX_RUNTIME_MS}" ]]; then
            args+=(--max-runtime-ms "${ENRICH_MAX_RUNTIME_MS}")
          fi
          if [[ -n "${ENRICH_ROW_MAX_RUNTIME_MS}" ]]; then
            args+=(--max-row-runtime-ms "${ENRICH_ROW_MAX_RUNTIME_MS}")
          fi
          if [[ -n "${ENRICH_MAX_SEARCH_QUERIES_PER_ROW}" ]]; then
            args+=(--max-search-queries "${ENRICH_MAX_SEARCH_QUERIES_PER_ROW}")
          fi
          if [[ -n "${ENRICH_MAX_RESULT_PAGES_PER_ROW}" ]]; then
            args+=(--max-result-pages "${ENRICH_MAX_RESULT_PAGES_PER_ROW}")
          fi
          if [[ -n "${ENRICH_MAX_HOMEPAGE_PAGES_PER_ROW}" ]]; then
            args+=(--max-homepage-pages "${ENRICH_MAX_HOMEPAGE_PAGES_PER_ROW}")
          fi
          npm run enrich -- "${args[@]}" 2>&1 | tee logs/enrich-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowercrm-enrich-logs
          path: logs/
          if-no-files-found: warn

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: enrich
          RUN_STEP_OUTCOME: ${{ steps.run_enrich.outcome }}
        run: |
          node src/discordNotify.js enrich --summary logs/discord-enrich-summary.json --error-log logs/enrich-output.log || true
