name: FlowerCRM Kakao Test

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Search region"
        required: true
        default: "김해"
      keyword:
        description: "Search keyword"
        required: true
        default: "의원"

permissions:
  contents: read

jobs:
  kakao-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Kakao secret
        shell: bash
        run: |
          if [[ -z "${KAKAO_REST_API_KEY}" ]]; then
            echo "::error::Missing required GitHub Secret: KAKAO_REST_API_KEY"
            exit 1
          fi
          echo "Kakao API secret configured: yes"

      - name: Notify Discord Started
        if: success()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: kakao-test
        run: |
          mkdir -p logs
          cat > logs/discord-kakao-started-summary.json <<EOF
          {"status":"STARTED","region":"${{ inputs.region }}","keyword":"${{ inputs.keyword }}"}
          EOF
          node src/discordNotify.js kakao --summary logs/discord-kakao-started-summary.json || true

      - name: Run Kakao query test
        id: run_kakao_test
        shell: bash
        run: |
          mkdir -p logs
          npm run collect:test-query -- --region "${{ inputs.region }}" --keyword "${{ inputs.keyword }}" 2>&1 | tee logs/kakao-test-output.log
          exit ${PIPESTATUS[0]}

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: kakao-test
          RUN_STEP_OUTCOME: ${{ steps.run_kakao_test.outcome }}
        run: |
          node src/discordNotify.js kakao --summary logs/discord-kakao-summary.json --error-log logs/kakao-test-output.log || true
