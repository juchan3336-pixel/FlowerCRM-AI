name: Repair Misaligned Sheets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually update the sheet. Use false for dry-run."
        required: true
        default: "false"
      tabs:
        description: "Comma-separated data tabs to repair"
        required: false
        default: "기업 DB,신규기업"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: 1vVk6WU-l1ILjLCY95Ua1SPqRxOTAh6tkyWjDjzbHvO0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "::error::Missing required GitHub Secret: GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "Google service account secret configured: yes"

      - name: Repair misaligned rows
        shell: bash
        run: |
          args=(--tabs "${{ inputs.tabs }}")
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          echo "npm run sheets:repair-misaligned -- ${args[*]}"
          npm run sheets:repair-misaligned -- "${args[@]}"
